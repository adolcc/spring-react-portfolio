services:
  # Desarrollo: Hot reload, monta código local
  dev:
    image: node:20-alpine  # Cambiar a Node 20
    container_name: portfolio-dev
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true

  # Producción: Build y serve con nginx
  prod:
    build: .
    container_name: portfolio-prod
    ports:
      - "8080:80"
    restart: unless-stopped
